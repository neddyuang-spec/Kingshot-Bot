name: Daily Redeem Bot

on:
  schedule:
    # 台灣時間每日晚上 8 點 (20:00) = UTC 時間 12:00
    - cron: '0 12 * * *'
  workflow_dispatch: # 允許在網頁上手動點擊測試

jobs:
  run-redeem-script:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行兌換腳本
        run: python main.py
