name: Kingshot 自動兌換

on:
  schedule:
    - cron: '0 12 * * *' # 每天中午 12 點執行（UTC 時間，可自行調整）
  workflow_dispatch:     # 允許在 GitHub 網頁手動點擊按鈕執行

jobs:
  redeem:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝 Playwright 與瀏覽器相依套件
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps

      - name: 執行自動兌換腳本
        run: python auto_redeem.py
