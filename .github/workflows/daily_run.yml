name: 每日自動兌換 Kingshot 禮物碼

on:
  schedule:
    - cron: '0 12 * * *' # 每日排程
  workflow_dispatch:     # 支援手動觸發按鈕

jobs:
  redeem:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝套件與 Playwright 瀏覽器
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium
          playwright install-deps

      - name: 執行自動兌換腳本
        run: python auto_redeem.py
