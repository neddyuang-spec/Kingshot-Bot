name: Kingshot Auto Redeem Daily

on:
  schedule:
    # cron 格式: 分 時 日 月 週 (UTC 時間)
    # 台灣時間 20:00 (UTC+8) = UTC 時間 12:00
    - cron: '0 12 * * *'
  workflow_dispatch: # 允許在 GitHub 上隨時點擊按鈕手動觸發測試

jobs:
  redeem:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: |
          pip install -r requirements.txt

      - name: 執行自動兌換腳本
        run: |
          python auto_redeem.py
